name: Сбор заказов

on:
  schedule:
    - cron: "*/20 * * * *"   # каждые 20 минут (GitHub может задерживать запуск)
  workflow_dispatch:
  push:
    paths: ["aggregator/**", "site/**", "config.yaml", ".github/workflows/aggregate.yml"]

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Взять прошлые данные из gh-pages
        run: |
          mkdir -p site/data
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:data/jobs.json > site/data/jobs.json 2>/dev/null || rm -f site/data/jobs.json
          fi
          ls -la site/data

      - name: Собрать заказы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
        run: python -m aggregator run

      - name: Опубликовать сайт в gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true          # одна коммит-версия, история не растёт
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Обновление ленты заказов"
